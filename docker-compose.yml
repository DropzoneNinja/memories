services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memories}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-memories}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 only — Postgres is never reached over the network by
      # anything (api talks to it via the internal `postgres:5432` compose
      # DNS name, not this mapping). This exists purely so host-side dev
      # tooling on *this machine* can reach it (`prisma migrate dev`,
      # `npm run dev` outside Docker, a native Postgres GUI client) — see
      # INSTALLATION.md. Binding to 127.0.0.1 rather than all interfaces
      # means it's never reachable from another machine on the network,
      # regardless of the port number. Configurable (default 5433) only to
      # avoid clashing with another local Postgres on this same machine.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memories}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-memories}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memories}
      IMMICH_BASE_URL: ${IMMICH_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4000
    ports:
      # Unlike postgres above, this genuinely needs to be reachable from
      # *other machines* — the TV and the dashboard's own browser
      # JavaScript both call the API directly (no reverse proxy in this
      # stack; the web container below never forwards API calls for
      # them). Configurable (default 4000) only to avoid clashing with
      # another app on this host — the container's own internal port
      # stays 4000 regardless (set via PORT above). If you change this,
      # also update WEB_API_BASE_URL to match, since that's what the
      # *browser* uses to reach the API. Must stay reachable from the
      # TV's IoT VLAN (10.10.40.0/24) as well as from Memories Web —
      # confirm firewall rules allow inbound here too, not just outbound
      # from this host (see PROJECT.md §12).
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: ./web
      # Vite bakes this into the built bundle at build time — a plain
      # `environment:` entry (as this used to be) has no effect since
      # the container just serves an already-built static bundle.
      args:
        VITE_API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Also genuinely needs LAN reachability, separately from api above
      # — this is what serves the dashboard's HTML/JS to whatever browser
      # someone opens it in. Configurable (default 5173) only to avoid
      # clashing with another app on this host — the container's own
      # internal port (also 5173, vite preview) never changes.
      - "${WEB_PORT:-5173}:5173"

volumes:
  postgres_data:
